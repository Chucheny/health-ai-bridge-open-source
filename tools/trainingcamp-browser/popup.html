<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Health AI Bridge 网页采集</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <p class="eyebrow">HEALTH AI BRIDGE</p>
    <h1>本机健康采集</h1>
    <p>先在当前华为训练营页面完成登录，再选择日期。日期按北京时间计算，最多 31 天。</p>
    <form id="collect-form">
      <label>数据类别<select id="kind" required><option value="" selected disabled>请选择类别</option><option value="sleep">睡眠会话与分期</option><option value="activity">运动首批（最多20条）</option><option value="activity-scroll">运动续读（最多5页）</option></select></label>
      <label>开始日期<input type="date" id="start" required></label>
      <label>结束日期（包含当天）<input type="date" id="end" required></label>
      <label class="confirm"><input type="checkbox" id="confirm" required><span>我确认读取所选类别和日期的数据，结果仅留本机。</span></label>
      <button id="collect" type="submit">读取所选日期</button>
    </form>
    <p id="status" role="status" aria-live="polite">仅在你点击时读取，不会上传到云端。</p>
    <button id="save" type="button" disabled>保存本地采集文件</button>
    <p class="note">读取时请保持此窗口打开。登录失效或权限不足时停止。运动续读按华为网页的翻页规则请求，完整性未知。保存后可在原工作台预检。</p>
  </main>
  <script type="module" src="popup.mjs"></script>
</body>
</html>
